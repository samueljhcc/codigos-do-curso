<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Vitória ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="music" src="lovers-rock.mp3"></audio>

<div class="container" id="questionPage">
    <h1>Para Vitória ❤️</h1>
    <h2>Sabia que terça à noite eu já tô por aí?</h2>
    <button id="yesBtn">Sim 💕</button>
    <button id="noBtn">Não 😅</button>
</div>

<div class="container hidden" id="datePage">
    <h2>Escolha a data e horário</h2>
    <input type="date" id="date">
    <input type="time" id="time">
    <button id="confirmBtn">Continuar</button>
</div>

<div class="container hidden" id="successPage">
    <h2>Encontro marcado! 🎉</h2>
    <p>Agora é só esperar! ❤️</p>
</div>

<script src="script.js"></script>
</body>
</html>
